{% extends 'base.html' %}
{% block content %}
<h2>Scoring settings</h2>
<div class="card">
  <div class="card-body">
    <form method="post" action="/admin/scoring">
      <input type="hidden" name="csrf_token" value="{{ request.session['csrf_token'] }}" />
      <div class="row g-3">
        <div class="col-md-3"><label class="form-label">Allocation floor (phi)</label><input class="form-control" name="phi" type="number" step="0.01" value="{{ settings.phi if settings else 0.2 }}" required /></div>
        <div class="col-md-3"><label class="form-label">Planning horizon</label><input class="form-control" name="horizon_days" type="number" value="{{ settings.horizon_days if settings else 3 }}" required /></div>
        <div class="col-md-6"><label class="form-label">Group weights JSON</label><textarea class="form-control" name="weights_json" rows="6">{{ settings.weights_json if settings else '{"base": 1.0, "elderly": 1.5, "disabled": 2.0, "maternal": 2.0, "infant": 1.5}' }}</textarea></div>
      </div>
      <div class="mt-3"><label class="form-label">Per-resource settings JSON</label><textarea class="form-control" name="resources_json" rows="8">{{ settings.resources_json if settings else '{}' }}</textarea></div>
      <button class="btn btn-primary mt-3" type="submit">Save version</button>
    </form>
  </div>
</div>
{% endblock %}
