{% extends 'base.html' %}
{% block content %}
<h2>Resource types</h2>
<div class="card mb-4">
  <div class="card-body">
    <form method="post" action="/admin/resources">
      <input type="hidden" name="csrf_token" value="{{ request.session['csrf_token'] }}" />
      <div class="row g-3">
        <div class="col-md-4"><input class="form-control" name="name" placeholder="Resource name" required /></div>
        <div class="col-md-4"><input class="form-control" name="unit" placeholder="Unit" required /></div>
        <div class="col-md-4"><input class="form-control" name="nu0" type="number" step="0.01" value="1.0" required /></div>
      </div>
      <button class="btn btn-primary mt-3" type="submit">Add resource</button>
    </form>
  </div>
</div>
<table class="table table-striped">
  <thead><tr><th>Name</th><th>Unit</th><th>nu0</th></tr></thead>
  <tbody>
    {% for resource in resources %}
    <tr><td>{{ resource.name }}</td><td>{{ resource.unit }}</td><td>{{ resource.nu0 }}</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
